name: Feature request
description: Propose an architecture-testing capability or usability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Architecture problem
      description: What decision or workflow is difficult to express today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful API, rule, report, or integration behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example and expected evidence
      description: Show a representative Java structure and the violation or result users should receive.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: The proposal can analyze bytecode without loading target classes or running target builds.
          required: true
