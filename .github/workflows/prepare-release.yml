name: Prepare signed release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to tag without the v prefix
        required: true
        type: string
      target_sha:
        description: Exact full commit SHA on main to release
        required: true
        type: string
      confirm:
        description: Enter "tag" to create and push the signed release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-tag-preparation
  cancel-in-progress: false

jobs:
  tag:
    if: inputs.confirm == 'tag'
    runs-on: ubuntu-latest
    environment: maven-central
    timeout-minutes: 10
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - name: Validate version, commit, and unused tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            echo "Tag v$VERSION already exists on origin." >&2
            exit 1
          fi
          if [[ "$tag_status" -ne 2 ]]; then
            echo "Could not establish whether tag v$VERSION exists (status $tag_status)." >&2
            exit "$tag_status"
          fi
      - name: Create, verify, and push signed tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.MAVEN_GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          passphrase_file="$RUNNER_TEMP/archunitjava-gpg-passphrase"
          gpg_wrapper="$RUNNER_TEMP/archunitjava-gpg-loopback"
          trap 'rm -f "$passphrase_file" "$gpg_wrapper"' EXIT

          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          imported_fingerprint="$({
            gpg --batch --with-colons --list-secret-keys "$MAVEN_GPG_KEY_FINGERPRINT"
          } | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$imported_fingerprint" = "$MAVEN_GPG_KEY_FINGERPRINT"

          printf '%s' "$MAVEN_GPG_PASSPHRASE" >"$passphrase_file"
          cat >"$gpg_wrapper" <<'EOF'
          #!/usr/bin/env bash
          exec gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/archunitjava-gpg-passphrase" "$@"
          EOF
          chmod 700 "$gpg_wrapper"

          git config user.name "Tristan Kruse"
          git config user.email "TristanKruse@users.noreply.github.com"
          git config user.signingkey "$MAVEN_GPG_KEY_FINGERPRINT"
          git config gpg.program "$gpg_wrapper"
          git tag -s -m "ArchUnitJava $VERSION" "v$VERSION" "$TARGET_SHA"
          git verify-tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
