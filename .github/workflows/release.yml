name: Stage Maven Central release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version already represented by the selected v-prefixed tag
        required: true
        type: string
      confirm:
        description: Enter "stage" to upload for Central validation without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-staging
  cancel-in-progress: false

jobs:
  stage:
    if: inputs.confirm == 'stage'
    runs-on: ubuntu-latest
    environment: maven-central
    timeout-minutes: 30
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@v7
      - name: Validate immutable tag and version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Set up Java, Central credentials, and signing key
        uses: actions/setup-java@v5
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Materialize the non-snapshot release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DgenerateBackupPoms=false -DnewVersion="$VERSION"
          test "$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" = "$VERSION"
      - name: Verify the exact release candidate
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease-candidate verify
      - name: Upload a signed user-managed Central deployment
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.MAVEN_GPG_KEY_FINGERPRINT }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -Prelease-candidate,release-sign,central-release \
            -Dgpg.keyname="$MAVEN_GPG_KEY_FINGERPRINT" deploy
      - name: Retain the submitted bundle for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archunitjava-${{ inputs.version }}-central-bundle
          path: target/central-publishing/*.zip
          if-no-files-found: ignore
          retention-days: 7
