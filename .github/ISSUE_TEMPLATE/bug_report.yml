name: Bug report
description: Report reproducible incorrect behavior in ArchUnitJava
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the public beta. Do not attach proprietary class files, credentials, or unreviewed archives.
  - type: input
    id: version
    attributes:
      label: ArchUnitJava version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: JDK, operating system, build tool, and analyzed bytecode version
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Provide a safe repository link or the smallest configuration and code needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and bounded diagnostics
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested the latest published beta and checked the documented limitations.
          required: true
        - label: This report contains no secrets or proprietary bytecode.
          required: true
