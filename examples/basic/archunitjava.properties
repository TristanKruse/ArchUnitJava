schema=archunitjava.cli.v1
inputs=target/classes
rules=service-boundary
emptySelection=fail
allowIncompleteAnalysis=false
resultFormat=json
graphFormat=json
graphDomain=types
rule.service-boundary.domain=types
rule.service-boundary.mode=only
rule.service-boundary.origins=glob:com.example.service.**
rule.service-boundary.targets=glob:com.example.api.**
rule.service-boundary.self=ignore
rule.service-boundary.external=ignore
rule.service-boundary.displayName=Services use only the public API
rule.service-boundary.rationale=Keep the example dependency direction explicit
rule.service-boundary.tags=example,boundary
rule.service-boundary.severity=error
